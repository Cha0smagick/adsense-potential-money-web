name: Deep audit

# Motor profundo sin servidor: el navegador dispara este workflow con
# workflow_dispatch y un PAT fine-grained (Actions: write + Contents: read).
# El informe queda comiteado en reports/<requestId>.json y la web lo lee por la API.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL a auditar (http/https)'
        required: true
        type: string
      sessions:
        description: 'Sesiones por mes'
        required: false
        default: '10000'
        type: string
      niche:
        description: 'Nicho (o auto)'
        required: false
        default: 'auto'
        type: string
      requestId:
        description: 'Identificador del informe'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deep-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Auditoría profunda
        run: |
          node src/deep/node-audit.ts "${{ inputs.url }}" \
            --sessions "${{ inputs.sessions }}" \
            --niche "${{ inputs.niche }}" \
            --pages 12 \
            --out "reports/${{ inputs.requestId }}.json"

      - name: Publicar el informe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Sin cambios que comitear"
          else
            git commit -m "audit: ${{ inputs.requestId }}"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.requestId }}
          path: reports/${{ inputs.requestId }}.json
